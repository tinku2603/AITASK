services:
  - type: web
    name: expense-agent-app
    runtime: node
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && npm install && npm run build
    startCommand: (PYTHONPATH=. python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 &) && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: BACKEND_URL
        value: http://127.0.0.1:8000
